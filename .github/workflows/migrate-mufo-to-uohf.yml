name: One-time MUFO to UOHF migration

on:
  pull_request_target:
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  migrate:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/uohf-migration-trigger'
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Replace project identity in tracked text files and paths
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path
          import subprocess

          replacements = [
              ("MoveTips-Unified-Functional-Ontology", "Unified-Ontology-Of-Human-Function"),
              ("MoveTips Unified Functional Ontology", "Unified Ontology of Human Function"),
              ("A Unified Ontology of Human Function", "Unified Ontology of Human Function"),
              ("MUFO", "UOHF"),
              ("Mufo", "UOHF"),
              ("mufo", "uohf"),
          ]

          tracked = subprocess.check_output(["git", "ls-files", "-z"]).decode().split("\0")
          tracked = [p for p in tracked if p]

          for raw_path in tracked:
              path = Path(raw_path)
              data = path.read_bytes()
              if b"\x00" in data:
                  continue
              try:
                  text = data.decode("utf-8")
              except UnicodeDecodeError:
                  continue
              updated = text
              for old, new in replacements:
                  updated = updated.replace(old, new)
              if updated != text:
                  path.write_text(updated, encoding="utf-8", newline="")

          for raw_path in sorted(tracked, key=lambda p: (p.count("/"), len(p)), reverse=True):
              new_path = raw_path
              for old, new in replacements:
                  new_path = new_path.replace(old, new)
              if new_path == raw_path:
                  continue
              source = Path(raw_path)
              if not source.exists():
                  continue
              target = Path(new_path)
              target.parent.mkdir(parents=True, exist_ok=True)
              subprocess.run(["git", "mv", raw_path, new_path], check=True)
          PY

      - name: Rebuild English academic PDF under the UOHF identity
        shell: bash
        run: |
          set -euo pipefail
          SOURCE="papers/unification/UOHF_Unification_EN_V1.0.md"
          OUTPUT="papers/unification/UOHF_Unification_EN_V1.0.pdf"

          if [[ -s "$SOURCE" ]]; then
            python3 -m pip install --disable-pip-version-check --quiet markdown weasyprint
            python3 <<'PY'
          from pathlib import Path
          import markdown
          from weasyprint import HTML

          source = Path("papers/unification/UOHF_Unification_EN_V1.0.md")
          output = Path("papers/unification/UOHF_Unification_EN_V1.0.pdf")
          text = source.read_text(encoding="utf-8")
          body = markdown.markdown(text, extensions=["extra", "tables", "fenced_code", "toc", "sane_lists"])
          css = """
          @page { size: A4; margin: 22mm 20mm 22mm 20mm; }
          body { font-family: 'DejaVu Serif', serif; font-size: 10.5pt; line-height: 1.55; color: #111; }
          h1 { font-size: 20pt; line-height: 1.2; margin: 0 0 18pt; }
          h2 { font-size: 15pt; margin-top: 20pt; page-break-after: avoid; }
          h3 { font-size: 12.5pt; margin-top: 16pt; page-break-after: avoid; }
          p { text-align: justify; orphans: 3; widows: 3; }
          blockquote { margin: 12pt 18pt; padding-left: 12pt; border-left: 2pt solid #666; }
          table { width: 100%; border-collapse: collapse; margin: 12pt 0; font-size: 9pt; }
          th, td { border: 0.6pt solid #777; padding: 5pt; vertical-align: top; }
          pre { white-space: pre-wrap; font-family: 'DejaVu Sans Mono', monospace; font-size: 8.5pt; background: #f5f5f5; padding: 8pt; }
          code { font-family: 'DejaVu Sans Mono', monospace; }
          a { color: #222; text-decoration: none; }
          """
          html = f"<!doctype html><html><head><meta charset='utf-8'><style>{css}</style></head><body>{body}</body></html>"
          HTML(string=html, base_url=str(source.parent.resolve())).write_pdf(str(output))
          PY
          fi

      - name: Remove one-time workflow
        shell: bash
        run: rm -f .github/workflows/migrate-mufo-to-uohf.yml

      - name: Validate complete migration
        shell: bash
        run: |
          set -euo pipefail
          if git grep -n -i 'mufo' -- . > /tmp/old-identity.txt; then
            echo 'Old MUFO identity remains in tracked text:'
            cat /tmp/old-identity.txt
            exit 1
          fi
          if find . -path './.git' -prune -o -iname '*mufo*' -print | grep -q .; then
            echo 'Old MUFO identity remains in a path:'
            find . -path './.git' -prune -o -iname '*mufo*' -print
            exit 1
          fi
          test -s README.md
          test -s README.zh-CN.md
          test -s UOHF_DEFINITION_ZH.md
          test -s papers/unification/UOHF_Unification_EN_V1.0.md
          test -s papers/unification/UOHF_Unification_ZH_V1.0.md
          test -s papers/unification/UOHF_Unification_EN_V1.0.pdf
          grep -q 'Unified Ontology of Human Function' README.md
          grep -q 'UOHF' README.md
          file papers/unification/UOHF_Unification_EN_V1.0.pdf | grep -q PDF

      - name: Commit and push migration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo 'No migration changes were necessary.'
            exit 0
          fi
          git commit -m "Migrate MUFO identity to UOHF"
          git push origin HEAD:main
