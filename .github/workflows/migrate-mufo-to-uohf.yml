name: One-time UOHF identity migration

on:
  push:
    branches:
      - main
  pull_request_target:
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  migrate:
    if: github.event_name == 'push' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/uohf-migration-trigger')
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Replace project identity in tracked text files and paths
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path
          import subprocess

          replacements = [
              ("MoveTips-Unified-Functional-Ontology", "Unified-Ontology-Of-Human-Function"),
              ("MoveTips Unified Functional Ontology", "Unified Ontology of Human Function"),
              ("A Unified Ontology of Human Function", "Unified Ontology of Human Function"),
              ("MUFO", "UOHF"),
              ("Mufo", "UOHF"),
              ("mufo", "uohf"),
          ]

          tracked = subprocess.check_output(["git", "ls-files", "-z"]).decode().split("\0")
          tracked = [p for p in tracked if p]

          for raw_path in tracked:
              path = Path(raw_path)
              data = path.read_bytes()
              if b"\x00" in data:
                  continue
              try:
                  text = data.decode("utf-8")
              except UnicodeDecodeError:
                  continue
              updated = text
              for old, new in replacements:
                  updated = updated.replace(old, new)
              if updated != text:
                  path.write_text(updated, encoding="utf-8", newline="")

          for raw_path in sorted(tracked, key=lambda p: (p.count("/"), len(p)), reverse=True):
              new_path = raw_path
              for old, new in replacements:
                  new_path = new_path.replace(old, new)
              if new_path == raw_path:
                  continue
              source = Path(raw_path)
              if not source.exists():
                  continue
              target = Path(new_path)
              target.parent.mkdir(parents=True, exist_ok=True)
              subprocess.run(["git", "mv", raw_path, new_path], check=True)
          PY

      - name: Delete stale PDFs and remove local PDF links
        shell: bash
        run: |
          set -euo pipefail

          find . -path './.git' -prune -o -type f -iname '*.pdf' -delete

          python3 <<'PY'
          from pathlib import Path

          for path in Path('.').rglob('*.md'):
              text = path.read_text(encoding='utf-8')
              lines = text.splitlines(keepends=True)
              updated = ''.join(line for line in lines if '.pdf' not in line.lower())
              if updated != text:
                  path.write_text(updated, encoding='utf-8', newline='')

          workflow = Path('.github/workflows/sync-unification-paper.yml')
          if workflow.exists():
              text = workflow.read_text(encoding='utf-8')
              lines = text.splitlines(keepends=True)
              updated = ''.join(line for line in lines if '.pdf' not in line.lower())
              updated = updated.replace(
                  'The bilingual Markdown files and English academic PDF are present and valid.',
                  'The bilingual Markdown files are present and valid.'
              )
              workflow.write_text(updated, encoding='utf-8', newline='')
          PY

      - name: Remove one-time migration assets
        shell: bash
        run: |
          rm -f \
            .github/uohf-migration-trigger*.txt \
            .github/workflows/migrate-mufo-to-uohf.yml \
            .github/workflows/migrate-uohf-to-uohf.yml

      - name: Validate complete migration
        shell: bash
        run: |
          set -euo pipefail

          if git grep -n -i 'mufo' -- . > /tmp/old-identity.txt; then
            echo 'Old MUFO identity remains in tracked text:'
            cat /tmp/old-identity.txt
            exit 1
          fi

          if find . -path './.git' -prune -o -iname '*mufo*' -print | grep -q .; then
            echo 'Old MUFO identity remains in a path:'
            find . -path './.git' -prune -o -iname '*mufo*' -print
            exit 1
          fi

          if find . -path './.git' -prune -o -type f -iname '*.pdf' -print | grep -q .; then
            echo 'Stale PDF files remain:'
            find . -path './.git' -prune -o -type f -iname '*.pdf' -print
            exit 1
          fi

          test -s README.md
          test -s README.zh-CN.md
          test -s UOHF_DEFINITION_ZH.md
          test -s papers/unification/UOHF_Unification_EN_V1.0.md
          test -s papers/unification/UOHF_Unification_ZH_V1.0.md
          grep -q '^# Unified Ontology of Human Function' README.md
          grep -q 'UOHF' README.md
          grep -q 'Unified Ontology of Human Function' README.md

      - name: Commit and push migration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo 'No migration changes were necessary.'
            exit 0
          fi
          git commit -m "Migrate project identity from MUFO to UOHF"
          git push origin HEAD:main
