name: Assemble and sync unification paper

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-publication-files:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify reader-facing publication files
        shell: bash
        run: |
          set -euo pipefail
          test -s papers/unification/MUFO_Unification_ZH_V1.0.md
          test -s papers/unification/MUFO_Unification_EN_V1.0.md
          test -s papers/unification/MUFO_Unification_EN_V1.0.pdf
          grep -q '10.5281/zenodo.21618293' papers/unification/MUFO_Unification_ZH_V1.0.md
          grep -q '10.5281/zenodo.21618293' papers/unification/MUFO_Unification_EN_V1.0.md
          file papers/unification/MUFO_Unification_EN_V1.0.pdf | grep -q PDF

      - name: Report verification result
        run: echo 'The bilingual Markdown files and English academic PDF are present and valid.'
